<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AIKA MUSIC</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
            background-color: #f5f0ff;
        }

        .music {
            background-color: #24113f;
            color: white;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .music h2 {
            color: #d7a7ff;
        }

        .music ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .music ul li a {
            color: white;
            text-decoration: none;
        }

        .music ul li a:hover {
            color: #d7a7ff;
        }

        .music button {
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            background-color: #9b5de5;
            cursor: pointer;
            font-size: 13px;
        }

        .music button:hover {
            background-color: #7d3fc1;
        }
        .hero{
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px;
            background-color: #e9d8ff;
        }
        .am{
            width: 50%;
        }
        .am h1{
            font-size: 50px;
            color: #24113f;
            margin-bottom: 15px;
        }
        .am p{
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;

        }
        .am image{
            width: 40%;
        }
        .am image img{
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 15px;
        }
        .am button{
             color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            background-color: #9b5de5;
            cursor: pointer;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <nav class="music">

        <h2>AIKA MUSIC</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Music</a></li>
            <li><a href="#">Artist</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <button>Listen Now</button>

    </nav>

    <section class="hero">
        <div class="am">
            <h1>FEEL THE MUSIC</h1>
            <p>
                Discover amazing music,explore new artists & enjoy every beat witk Aika Music</p>
                <button>Explore Music</button>

        </div>

        <div class="am image">
            <img src="guitar.jpg" alt="aika">

        </div>

    </section>

</body>

</html>


</body>
</html>
